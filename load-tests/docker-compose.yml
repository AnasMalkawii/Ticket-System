services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketsystem
      POSTGRES_USER: ticketsystem
      POSTGRES_PASSWORD: ticketsystem
    ports:
      - "${DAY6_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketsystem -d ticketsystem"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${DAY6_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
