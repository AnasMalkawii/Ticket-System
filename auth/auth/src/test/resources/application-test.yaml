# Test profile: isolated in-memory H2 so tests never touch the dev Postgres.
# JWT secrets are still provided by the classpath secrets.properties from main resources.
spring:
  datasource:
    url: jdbc:h2:mem:authtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
