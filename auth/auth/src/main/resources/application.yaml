server:
  port: 8080
  # Honour X-Forwarded-* / Forwarded headers so request.getRemoteAddr() reflects the
  # real client IP when running behind a trusted reverse proxy or load balancer.
  forward-headers-strategy: framework

spring:
  # Local dev secrets (DB_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET) are loaded from
  # a git-ignored secrets.properties on the classpath (src/main/resources) when present.
  # Loading from the classpath (not a file path) makes it work regardless of the working
  # directory - e.g. launched from IntelliJ. "optional:" means it's skipped in production,
  # where those values come from real environment variables instead.
  config:
    import: optional:classpath:secrets.properties

  application:
    name: auth

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


springdoc:
  swagger-ui:
    enabled: true

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

# Dev defaults for the refresh-token cookie. Hardened in application-prod.yaml.
app:
  cookie:
    secure: false
    same-site: Lax