name: ticket-system-day10

x-app: &app
  image: ticket-system-day10:local
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &app-environment
    SPRING_PROFILES_ACTIVE: load
    SERVER_PORT: 8080
    # The flash-sale gate starts immediately after readiness. Avoid C2 compiler bursts
    # competing with the first reservation wave; this profile values predictable startup
    # latency over the eventual peak of a long-running, fully tiered JVM.
    JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1
    # Turn Hibernate JDBC batches into PostgreSQL multi-row INSERTs. This shortens the
    # transaction that owns the hot inventory lock without changing commit semantics.
    DB_URL: jdbc:postgresql://postgres:5432/ticketsystem?reWriteBatchedInserts=true
    DB_USERNAME: ticketsystem
    DB_PASSWORD: ticketsystem
    # The event inventory row is the serialization point, so extra connections increase
    # contention instead of throughput. Four fully-warmed connections per replica keep that
    # queue short; callers may wait within (but never beyond) the 5-second API budget.
    DB_POOL_SIZE: 4
    DB_POOL_MIN_IDLE: 4
    DB_POOL_CONNECTION_TIMEOUT_MS: 4500
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: ticketing
    RABBITMQ_PASSWORD: ticketing
    INVENTORY_STRATEGY: ATOMIC
    JWT_SIGNING_KEY: day10-shared-signing-key-0123456789abcdef
    TICKETING_EXPIRY_WORKER_SCHEDULING_ENABLED: "true"
    TICKETING_MESSAGING_ENABLED: "true"
    TICKETING_MESSAGING_PUBLISHER_SCHEDULING_ENABLED: "true"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
    interval: 3s
    timeout: 2s
    retries: 45
    start_period: 25s
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ticketsystem
      POSTGRES_USER: ticketsystem
      POSTGRES_PASSWORD: ticketsystem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketsystem -d ticketsystem"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticketing
      RABBITMQ_DEFAULT_PASS: ticketing
    volumes:
      - ./rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:${DAY10_RABBIT_UI_PORT:-25672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  app1:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app2

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DAY10_APP_PORT:-28100}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/livez"]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${DAY10_PROMETHEUS_PORT:-29090}:9090"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${DAY10_GRAFANA_PORT:-23000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
