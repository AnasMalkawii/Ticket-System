groups:
  - name: ticket-system-day10
    rules:
      - alert: TicketSystemErrorRateSpike
        expr: |
          sum(rate(http_server_requests_seconds_count{job="ticket-system",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="ticket-system"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Ticket System 5xx rate exceeds 5 percent
          description: The fleet-wide HTTP error ratio has exceeded 5 percent for five minutes.

      - alert: TicketSystemHighReservationP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ticketing_reservation_duration_seconds_bucket{job="ticket-system"}[5m]))) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Reservation p95 exceeds the 300 ms SLO
          description: End-to-end reservation latency has remained above its p95 objective for five minutes.

      - alert: TicketSystemDatabasePoolSaturated
        expr: |
          max by (instance) (hikaricp_connections_active{job="ticket-system"})
          / clamp_min(max by (instance) (hikaricp_connections_max{job="ticket-system"}), 1) > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Database connection pool is above 90 percent
          description: Replica {{ $labels.instance }} is close to exhausting its Hikari pool.

      - alert: TicketSystemRabbitQueueBacklog
        expr: sum(rabbitmq_queue_messages_ready{job="rabbitmq",queue=~"ticketing.*"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RabbitMQ ticketing queue backlog exceeds 100 messages
          description: Ready messages have remained above the operational queue threshold for five minutes.

      - alert: TicketSystemHealthCheckFailed
        expr: up{job="ticket-system"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Ticket System replica is not scrapeable
          description: Prometheus cannot reach {{ $labels.instance }}; check readiness and container logs.
