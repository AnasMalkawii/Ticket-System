worker_processes auto;

events {
    worker_connections 4096;
}

http {
    map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        "" $request_id;
    }

    log_format structured escape=json
        '{"timestamp":"$time_iso8601","requestId":"$correlation_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"durationSeconds":$request_time,"upstream":"$upstream_addr"}';
    # Burst completion can otherwise serialize on one write() per request to Docker's log
    # pipe. Keep the same audit trail, but flush it in bounded chunks.
    access_log /dev/stdout structured buffer=64k flush=1s;
    error_log /dev/stderr warn;

    upstream ticket_system {
        least_conn;
        # Passive ejection turned a short overload into a no-live-upstream storm. These
        # replicas already expose readiness and restart automatically; keep routing during
        # a burst instead of declaring every healthy-but-busy replica dead.
        server app1:8080 max_fails=0;
        server app2:8080 max_fails=0;
    }

    server {
        listen 8080;
        server_name _;

        location = /livez {
            proxy_pass http://ticket_system;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $correlation_id;
        }

        location = /readyz {
            proxy_pass http://ticket_system;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $correlation_id;
        }

        # Prometheus scrapes replicas directly on the private Compose network.
        location ^~ /actuator/ {
            return 404;
        }

        location / {
            proxy_pass http://ticket_system;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $correlation_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            add_header X-Upstream-Replica $upstream_addr always;
        }
    }
}
