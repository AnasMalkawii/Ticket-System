# Integration-test profile. The datasource is supplied by Testcontainers via
# @ServiceConnection, so no URL is configured here.
spring:
  rabbitmq:
    username: test-only
    password: test-only
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Tests invoke expiry batches explicitly. Disabling only the timer avoids background work
# racing fixtures while keeping the transactional worker bean available for concurrency tests.
ticketing:
  payment:
    # Keep the deterministic timeout drill fast while preserving the production relationship
    # between deadline and simulated gateway delay.
    timeout: 150ms
    mock-timeout-delay: 2s
  expiry-worker:
    scheduling-enabled: false
  security:
    issuer: ticket-system-test
    audience: ticket-system-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    clock-skew: 5s
    # Public, test-only keys. Production has no fallback values.
    access-secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    refresh-secret: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
    cookie:
      refresh-name: __Host-ticket_refresh
      csrf-name: __Host-ticket_csrf
      path: /
      secure: true
      same-site: Strict
    login-protection:
      max-failed-attempts: 5
      lock-duration: 15m
      rate-window: 1m
      max-attempts-per-ip: 1000
      max-attempts-per-username: 1000
    allowed-origins: https://ticket-ui.example.test
  # Existing Day 1-4 integration tests exercise the reservation service, not Redis. Dedicated
  # Day 5 tests enable the limiter against Redis explicitly.
  rate-limit:
    enabled: false
  # The existing PostgreSQL-only suite must not depend on a local broker. Day 7's dedicated
  # integration test overrides this and supplies its RabbitMQ Testcontainer explicitly.
  messaging:
    enabled: false
